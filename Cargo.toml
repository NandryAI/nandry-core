[workspace]
members = [
    "crates/nandry-compiler",
    "crates/nandry-ir",
    "crates/nandry-trace",
    "crates/nandry-wasm",
    "crates/nandry-vm",
    "crates/nandry-circuits",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NandryAI/nandry-core"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
